{% include "layout.html" %}
{% block content %}

<main class="flex-grow-1">
    <div class="container-lg mt-3">
        <h1>Сайты</h1>
        <div class="table-responsive">
            <table class="table table-bordered table-hover text-nowrap" data-test="urls">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Имя</th>
                        <th>Последняя проверка</th>
                        <th>Код ответа</th>
                    </tr>
                </thead>
                <tbody>
                    {% for all in all_about_url %}
                    <tr>
                        <td>{{ all[0].id }}</td>
                        <td><a href="{{ url_for('get_url', id=all[0].id) }}">{{ all[0].name }}</a></td>
                        <td>{{ all[1].created_at }}</td>
                        <td>{{ all[1].status_code }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</main>

{% endblock %}
